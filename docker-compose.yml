# Two ways to work on the site:
#   docker compose up dev       - live-reloading authoring server on :8080
#   docker compose run --rm build && docker compose up preview
#                               - production build, served on :8081 the way
#                                 GitHub Pages will serve it
#
# node_modules is a named volume rather than part of the bind mount, so a
# host-built dependency tree can never leak into the container or vice versa.

x-node: &node
  build:
    context: .
    dockerfile: devops/Dockerfile
  volumes:
    - ./content:/app/content
    - ./src:/app/src
    - ./eleventy.config.js:/app/eleventy.config.js
    - ./.eleventyignore:/app/.eleventyignore
    - ./_site:/app/_site
    - node_modules:/app/node_modules

services:
  dev:
    <<: *node
    command: npm start
    ports:
      - "8080:8080"

  build:
    <<: *node
    command: npm run build

  preview:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./_site:/usr/share/nginx/html:ro
      - ./devops/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  node_modules:
