# Serves the built site the way GitHub Pages does, so that a link which works
# against `preview` also works in production. MIME types (including PDF) come
# from the mime.types the base image already includes at the http level.
server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Keep the directory redirect relative so it does not drop the
    # published port when previewing on localhost:8081.
    absolute_redirect off;

    # GitHub Pages serves index.html from a directory and redirects a bare
    # path to its trailing-slash form. Mirror that, then fall through to 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
